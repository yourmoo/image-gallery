# The end-to-end stack: the production image, driven against a fake upstream.
#
# This is what makes the BDD suite trustworthy about deployment. `web` is built
# from the same Dockerfile that ships, so it runs the real gunicorn worker model
# rather than `runserver` -- which matters because each worker holds its own
# LocMemCache, and a harness with one process cannot observe that.
#
# Run it with:
#     docker compose -f tests/compose.e2e.yaml up -d --build
#     pytest -c tests/pytest.ini -m e2e
#     docker compose -f tests/compose.e2e.yaml down
#
# It lives under tests/ because it is test apparatus, not a deployment: it
# builds the shipping image but points it at a fake upstream with settings no
# production instance would want. `compose.yaml` at the root is the deployment
# file. Build contexts below are therefore written relative to *this* file, so
# the paths stay correct wherever compose is invoked from.
#
# The suite talks to `web` on 8081 and to the fake's control API on 8091, so
# this stack runs alongside the ordinary compose.yaml without a port clash.
#
# **The project name is what actually keeps them apart.** Compose derives it
# from the directory unless told otherwise, so both files defaulted to
# `image-gallery` and both declare a service called `web` — which made them the
# *same container*. Starting one silently replaced the other, and tearing
# either down stopped both. Naming this project explicitly is what lets the
# same image run twice: once against the fake for testing, once against
# picsum.dev for a demo.
name: gallery-e2e

services:
  fake-upstream:
    build:
      context: ./e2e/fake_upstream
      dockerfile: Dockerfile
    image: image-gallery-fake-upstream:latest
    ports:
      # Exposed so the suite can drive the control API from the host.
      - "8091:8000"

  web:
    build:
      # The repo root, one level up: the shipping image is built from the same
      # Dockerfile a deployment uses, which is what makes this suite evidence
      # about the artifact rather than about a test harness.
      context: ..
      dockerfile: Dockerfile
    image: image-gallery:latest
    ports:
      - "8081:8000"
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_LOG_LEVEL: "WARNING"

      # Reached by service name on the compose network.
      GALLERY_UPSTREAM_BASE_URL: "http://fake-upstream:8000"

      # The catalogue every feature file's Background declares.
      GALLERY_CATALOGUE_SIZE: "100"
      GALLERY_DEFAULT_PAGE_SIZE: "10"
      GALLERY_DEFAULT_SIZE: "medium"

      # Below the fake's hang duration, so "the gallery does not respond in
      # time" fails fast instead of stalling the suite.
      GALLERY_UPSTREAM_TIMEOUT: "1.0"

      # One attempt per image: retries would multiply the upstream call counts
      # the scenarios assert on.
      GALLERY_UPSTREAM_RETRIES: "0"

      GALLERY_CACHE_TTL: "300"
      GALLERY_CACHE_RETENTION: "3600"
      GALLERY_CACHE_DIR: "/dev/shm/gallery-cache"

      # No browser caching under test. Scenarios empty the *server* cache and
      # then assert on what reached the fake upstream; a browser holding an
      # image would satisfy the request without the server ever seeing it, and
      # the assertion would read an empty log. Production wants the opposite —
      # see GALLERY_BROWSER_CACHE_MAX_AGE in settings.py.
      GALLERY_BROWSER_CACHE_MAX_AGE: "0"
    # Shared across workers, in memory. See compose.yaml for the sizing.
    tmpfs:
      - /dev/shm/gallery-cache:size=128m
    depends_on:
      fake-upstream:
        condition: service_healthy
