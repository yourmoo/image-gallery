; Pytest configuration for the image gallery test suite.
;
; This file lives in tests/ rather than the project root, so pytest's rootdir
; resolves to tests/ when it is passed via -c. All paths below are relative to
; this directory.
;
; Run from the project root with:
;     pytest -c tests/pytest.ini
; See tests/README.md for the full command set.

[pytest]
DJANGO_SETTINGS_MODULE = image_gallery.settings
testpaths = .
bdd_features_base_dir = features
addopts = --strict-markers
markers =
    e2e: browser tests driven by Playwright against a running server
