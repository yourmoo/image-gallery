; Pytest configuration for the image gallery test suite.
;
; This file lives in tests/ rather than the project root, so pytest's rootdir
; resolves to tests/ when it is passed via -c. All paths below are relative to
; this directory.
;
; Run from the project root with:
;     pytest -c tests/pytest.ini
; See tests/README.md for the full command set.

[pytest]
DJANGO_SETTINGS_MODULE = image_gallery.settings
testpaths = .
bdd_features_base_dir = features
addopts = --strict-markers
; Gherkin tags become pytest markers, so every tag must be declared here --
; --strict-markers turns a typo into a failed run rather than a silently
; unselectable scenario.
;
; Two vocabularies, deliberately separate:
;
;   Fn_m     the requirement from docs/core-features.md that the scenario
;            covers. Underscored because a dot is ambiguous inside a -m
;            expression. tests/unit/test_requirement_coverage.py fails if a
;            requirement has no scenario, or a scenario names an unknown one.
;
;   stageN   build order. Scenarios in a stage depend only on earlier stages,
;            so `-m stage1` is a runnable slice rather than an arbitrary
;            subset. See tests/README.md for the sequence and its rationale.
;
;     pytest -c tests/pytest.ini -m "F2_2"              one requirement
;     pytest -c tests/pytest.ini -m "stage1 or stage2"  the first slice
;     pytest -c tests/pytest.ini -m "e2e and not stage6"  skip resilience
markers =
    e2e: browser tests driven by Playwright against a running server

    F1_1: Display a collection of images in a grid layout
    F1_2: Images generated dynamically through backend logic
    F1_3: Images vary by size and visual filter parameters

    F2_1: Pagination, with page state URL-driven
    F2_2: Invalid page redirects to page 1 and explains itself
    F2_3: Pagination links preserve active filters and sizing
    F2_4: Ten images per page by default
    F2_5: Image count configurable by the user via UI
    F2_6: Page 1 fetches images 1-10, page 2 fetches 11-20
    F2_7: Each page composed from multiple upstream image calls

    F3_1: Named sizes, medium by default
    F3_2: Custom pixel dimensions, bounded
    F3_3: Grayscale filter
    F3_4: Blur filter, 0-10
    F3_5: Grayscale and blur usable together
    F3_6: Invalid parameters fall back to defaults and explain themselves

    F4_1: Opening an image from the grid, and returning to it
    F4_2: The detail view renders larger than the grid
    F4_3: Active filters carry over to the detail view
    F4_4: The detail page reports the parameters actually used

    ; F5_1 to F5_4 are code-structure requirements -- logic on the backend,
    ; templates not constructing URLs, URL generation centralised, Django URL
    ; reversing. None is observable from outside the application, so none has
    ; a scenario; they are verified by unit tests that inspect structure.
    ; See "Out of scope" in tests/README.md.
    F5_5: Downloaded images are cached while the app is running

    ; Not an F-requirement: the resilience matrix from
    ; docs/adr/0012-resilience-strategy.md -- per-tile failure, stale-cache
    ; fallback, and timeout behaviour.
    resilience: Failure handling per image, per ADR 12

    stage1: The shell's published bounds and the grid
    stage2: The image proxy, one upstream call per tile
    stage3: Pagination
    stage4: The image-count control
    stage5: Notices and invalid-page recovery
    stage6: Resilience -- partial failure, outage, slowness, cache
    stage7: Size and filter parameters
    stage8: Variation validation and cross-page persistence
    stage9: The detail view
    stage10: Filters and the parameters panel on the detail view
