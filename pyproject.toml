[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-gallery"
version = "0.1.0"
description = "Django image gallery backed by picsum.dev"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<6.0",
    "gunicorn>=22.0",
    "requests>=2.32",
    # Serves collected static files from the gunicorn process. Django's own
    # staticfiles handler only serves them when DEBUG is on, so without this
    # the container returns 404 for every asset.
    "whitenoise>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-django>=4.8",
    "pytest-bdd>=7.2",
    "pytest-cov>=5.0",
    "playwright>=1.44",
    "pytest-playwright>=0.5",
    "requests-mock>=1.12",
    # Self-contained HTML test reports. Behavioural coverage is reported by
    # scenario rather than by line, so the report is the primary artifact.
    "pytest-html>=4.1",
]

[project.scripts]
image-gallery-admin = "image_gallery.manage:main"

[tool.setuptools.packages.find]
include = ["image_gallery*"]

[tool.setuptools.package-data]
image_gallery = ["templates/**/*", "static/**/*"]

# Test and coverage configuration lives in tests/pytest.ini — see tests/README.md.
