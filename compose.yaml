services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: image-gallery:latest
    ports:
      - "8080:8000"
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_LOG_LEVEL: "INFO"
      GALLERY_CACHE_TTL: "300"
      GALLERY_CACHE_MAX_ENTRIES: "1000"
      GALLERY_CACHE_CULL_FREQUENCY: "3"
      GALLERY_CACHE_DIR: "/dev/shm/gallery-cache"
      GALLERY_DEFAULT_SIZE: "medium"
      GALLERY_DEFAULT_PAGE_SIZE: "10"
      GALLERY_UPSTREAM_BASE_URL: "https://picsum.dev"
      GALLERY_UPSTREAM_TIMEOUT: "5.0"
      GALLERY_UPSTREAM_RETRIES: "2"
    # The image cache, in shared memory rather than on disk. Every gunicorn
    # worker reads and writes the same files, which is what makes a cache hit
    # independent of which worker serves the request -- LocMemCache lives in one
    # process's heap and cannot be shared.
    #
    # Sized for the 300-entry cap: ~55 MB at the pathological all-at-ceiling
    # case (~182 KB/entry), so 128 MB leaves headroom. tmpfs is volatile, which
    # matches "cached while the app is running" exactly -- nothing survives a
    # restart, and no volume needs managing.
    tmpfs:
      - /dev/shm/gallery-cache:size=128m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)"
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
